name: covermon
channels:
  - bioconda
  - conda-forge
dependencies:
 - pandas = 2.*
 - numpy = 1.23.1
 - cowpy = 1.1.0
 - livereload
 - openpyxl >= 3.1.0
 - samtools = 1.15.1
 - minimap2 = 2.24
 - pandoc
 - r-argparser
 - r-rcolorbrewer
 - r-cowplot
 - r-ggthemes
 - r-here
 - r-kableextra
 - r-knitr # implied by kableextra but let's be explicit
 - r-rmarkdown
 - r-tidyverse
 - xlrd >= 2.0.1
